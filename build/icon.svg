<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#1b5cff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e6ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b0630" flood-opacity=".45"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <!-- macOS-style tile -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- film strip running top to bottom -->
    <rect x="300" y="60" width="424" height="904" fill="#140b3a" opacity=".55"/>
    <g fill="#ffffff" opacity=".55">
      <rect x="318" y="112" width="34" height="44" rx="9"/><rect x="318" y="212" width="34" height="44" rx="9"/>
      <rect x="318" y="312" width="34" height="44" rx="9"/><rect x="318" y="412" width="34" height="44" rx="9"/>
      <rect x="318" y="512" width="34" height="44" rx="9"/><rect x="318" y="612" width="34" height="44" rx="9"/>
      <rect x="318" y="712" width="34" height="44" rx="9"/><rect x="318" y="812" width="34" height="44" rx="9"/>
      <rect x="672" y="112" width="34" height="44" rx="9"/><rect x="672" y="212" width="34" height="44" rx="9"/>
      <rect x="672" y="312" width="34" height="44" rx="9"/><rect x="672" y="412" width="34" height="44" rx="9"/>
      <rect x="672" y="512" width="34" height="44" rx="9"/><rect x="672" y="612" width="34" height="44" rx="9"/>
      <rect x="672" y="712" width="34" height="44" rx="9"/><rect x="672" y="812" width="34" height="44" rx="9"/>
    </g>
  </g>
  <!-- three camera cards on the strip; the middle one is live -->
  <rect x="378" y="150" width="268" height="170" rx="30" fill="url(#card)" opacity=".55"/>
  <rect x="378" y="704" width="268" height="170" rx="30" fill="url(#card)" opacity=".55"/>
  <g filter="url(#sh)">
    <rect x="300" y="352" width="424" height="320" rx="46" fill="url(#card)"/>
  </g>
  <!-- a simple person + live dot in the middle card -->
  <circle cx="512" cy="478" r="62" fill="#5b3df5"/>
  <path d="M398 632 C 410 560, 460 538, 512 538 C 564 538, 614 560, 626 632 Z" fill="#5b3df5"/>
  <circle cx="668" cy="400" r="20" fill="#ff3b5c"/>
</svg>
